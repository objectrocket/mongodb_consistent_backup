# Python CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2
references:
  objectrocket-docker-auth:
    auth:
      username: ${DOCKER_USERNAME}
      password: ${DOCKER_PASSWORD}
  context-to-use:
    context: objectrocket-shared
jobs:
  build:
    docker:
      # specify the version you desire here
      # use `-browsers` prefix for selenium tests, e.g. `3.6.1-browsers`
    - image: objectrocket/circleci-rpm-builder:master
      auth:
        username: $DOCKER_USER
        password: $DOCKER_PASS

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/postgres:9.4

      environment:
        PYTHON_BIN: /usr/local/bin/python2.7

    working_directory: ~/repo

    steps:
    - checkout
  
    - run:
        name: set version and build the rpm
        command: |
          set -xeuo pipefail
          version=$(cat VERSION)
          build_version="${version}.${CIRCLE_BUILD_NUM}"
          echo "${build_version}" > VERSION
          make rpm

          git config user.email "dev@objectrocket.com"
          git config user.name "objectrocketdev"

          if git rev-parse -q --verify "refs/tags/${build_version}" >/dev/null; then
            echo "Git tag ${build_version} already exists locally; skipping tag creation."
          else
            git tag -a "${build_version}" -m "Tagged by ${CIRCLE_BUILD_URL}" HEAD
          fi

          rpm -qa | grep ssh || true
          libssh2_pkg=$(rpm -q libssh2 2>/dev/null || true)
          if [ -n "${libssh2_pkg}" ]; then
            rpm -ql "${libssh2_pkg}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${build_version}" >/dev/null 2>&1; then
            echo "Git tag ${build_version} already exists on origin; skipping push."
          else
            git push origin "refs/tags/${build_version}"
          fi

          mkdir -p mongodb_consistent_backup_rpm
          built_rpm=$(find build/rpm/RPMS/x86_64 -maxdepth 1 -type f -name "mongodb_consistent_backup-${build_version}-1.*.x86_64.rpm" | head -n 1)
          if [ -z "${built_rpm}" ]; then
            echo "Built RPM for version ${build_version} not found."
            find build/rpm/RPMS -maxdepth 2 -type f -name '*.rpm'
            exit 1
          fi
          cp "${built_rpm}" mongodb_consistent_backup_rpm/

    - save_cache:
        paths:
        - ./venv
        key: v1-dependencies-{{ checksum "requirements.txt" }}

    - store_artifacts:
        path: mongodb_consistent_backup_rpm
        destination: mongodb_consistent_backup
